name: Build and Publish Docker Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lower case owner and image name
        id: prep
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${OWNER_LC}/fnos-auto-server"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "OWNER_LC=${OWNER_LC}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export Docker image to tar archive
        run: |
          docker pull ${{ env.IMAGE_NAME }}:latest
          docker tag ${{ env.IMAGE_NAME }}:latest fnos-server:latest
          docker save fnos-server:latest | gzip > fnos-server-latest.tar.gz
          ls -lh fnos-server-latest.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnos-server-docker-image
          path: fnos-server-latest.tar.gz
          retention-days: 30

      - name: Release Docker tarball
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "fnos-server 飞牛一键导入离线镜像包"
          body: |
            ### 飞牛 NAS (fnOS) 离线镜像发布
            
            **使用方法（无需在 NAS 上现场构建，3 秒导入）：**
            1. 下载下方 Assets 中的 `fnos-server-latest.tar.gz`；
            2. 打开飞牛 NAS 管理面板 -> 进入 **「Docker」** -> **「本地镜像」**；
            3. 点击右上角 **「导入镜像」**，选择该文件上传；
            4. 导入成功后，在 Compose 中使用 `image: fnos-server:latest` 直接启动即可！
            
            也可直接使用在线镜像拉取：
            ```yaml
            image: ${{ env.IMAGE_NAME }}:latest
            ```
          files: fnos-server-latest.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
